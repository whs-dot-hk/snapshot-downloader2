[package]
name = "snapshot-downloader"
version = "0.1.0"
edition = "2021"
authors = ["Snapshot Downloader Team"]
description = "A tool to download and extract Cosmos node snapshots"

[dependencies]
anyhow = "1.0.102"
aws-config = "1.8.18"
aws-sdk-s3 = "1.137.0"
bytes = "1.12.0"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1.1.9"
futures-util = "0.3.32"
indicatif = "0.18.4"
lz4 = "1.28.1"
regex = "1.12.4"
reqwest = { version = "0.13.4", features = ["stream", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10.9"
tar = "0.4.46"
tokio = { version = "1.52.3", features = ["full", "signal"] }
tokio-util = { version = "0.7.18", features = ["io"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3.27.0"
