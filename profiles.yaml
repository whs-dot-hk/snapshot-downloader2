# Profiles for `--profile` (see README).
# Each profile has two sections:
#   config:   values used to configure/run the node (chain_id, moniker,
#             binary_url, binary_relative_path, app_yaml, config_yaml)
#   snapshot: the path into the snapshots.json index (index_url,
#             chain_prefix, env_key, db_type, pruning_type)
# Shared values use YAML anchors: chain-level settings plus per-db-backend
# app_yaml / config_yaml (db_backend must match snapshot db_type).
# The `_anchors` section is not read by the program (only `profiles` is).

_anchors:
  cronos_mainnet:
    chain_id: &cronos_mainnet_chain_id "cronosmainnet_25-1"
    snapshot_index_url: &cronos_mainnet_index "https://snapshot.cronos.com/snapshots.json"
    binary_url: &cronos_mainnet_binary_url "https://github.com/crypto-org-chain/cronos/releases/download/{version}/cronos_{version_no_v}_{os}_{arch}.tar.gz"
    binary_relative_path: &cronos_mainnet_binary_path "bin/cronosd"

